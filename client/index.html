<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Farm Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Mali = ฟอนต์ไทยลายมือกลมๆ น่ารัก (โหลดไม่ได้ก็ตกไปใช้ฟอนต์ระบบ) */
      :root { --font: 'Mali', system-ui, sans-serif; }
      html, body, #app { margin: 0; padding: 0; height: 100%; background: #bfe6c4; overflow: hidden; font-family: var(--font); touch-action: none; overscroll-behavior: none; }
      button, input { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
